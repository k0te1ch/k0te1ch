<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-label="k0te1ch: Backend Engineer and System Designer">
  <defs>
    <radialGradient id="glow" cx="85%" cy="0%" r="70%">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#f4f4fb"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#6366F1" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="880" height="320" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="320" fill="#0d0d16"/>
    <rect width="880" height="320" fill="url(#grid)"/>
    <rect width="880" height="320" fill="url(#glow)"/>
    <rect width="880" height="40" fill="#181826"/>
    <line x1="0" y1="40" x2="880" y2="40" stroke="#2a2a44"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="319" rx="12" fill="none" stroke="#2a2a44"/>
  <circle cx="24" cy="20" r="6" fill="#3a3a55"/>
  <circle cx="44" cy="20" r="6" fill="#3a3a55"/>
  <circle cx="64" cy="20" r="6" fill="#6366F1"/>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="16">
    <text x="88" y="25" fill="#8b8ba3" font-size="12">k0te1ch@github: ~</text>

    <g opacity="0"><animate attributeName="opacity" to="1" begin="0.3s" dur="0.2s" fill="freeze"/>
      <text x="32" y="86" fill="#6366F1">$</text><text x="52" y="86" fill="#d4d4e0">whoami</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
      <text x="32" y="140" fill="url(#title)" font-size="38" font-weight="700">Backend Engineer</text>
      <text x="32" y="184" fill="url(#title)" font-size="38" font-weight="700">&amp; System Designer</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.6s" dur="0.4s" fill="freeze"/>
      <text x="32" y="218" fill="#a8a8bd">Backend systems built for scalability and real-world impact.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.2s" dur="0.2s" fill="freeze"/>
      <text x="32" y="268" fill="#6366F1">$</text><text x="52" y="268" fill="#d4d4e0">echo $FOCUS</text>
      <text x="32" y="294" fill="#8b8ba3">architecture · performance · monetization</text>
      <rect x="400" y="281" width="9" height="16" fill="#f4f4fb">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
