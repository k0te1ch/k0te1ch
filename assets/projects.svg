<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="Featured projects: PodBoxBot, Timetable-bot, powerpeek, DialogEngine">
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .card{fill:#11111b;stroke:#2a2a44}
    .name{font:700 19px 'JetBrains Mono',Consolas,monospace;fill:#f4f4fb}
    .desc{font:14px 'JetBrains Mono',Consolas,monospace;fill:#a8a8bd}
    .meta{font:12px 'JetBrains Mono',Consolas,monospace;fill:#8b8ba3}
    .lang{font:600 12px 'JetBrains Mono',Consolas,monospace;fill:#a5b4fc}
  </style>

  <g>
    <rect class="card" x="0.5" y="0.5" width="434" height="154" rx="10"/>
    <rect x="1" y="1" width="433" height="3" rx="1.5" fill="url(#edge)"/>
    <text class="name" x="24" y="44">PodBoxBot</text>
    <text class="desc" x="24" y="72">Telegram bot in Python.</text>
    <text class="desc" x="24" y="94">Long-running, versioned releases.</text>
    <circle cx="28" cy="128" r="5" fill="#3572A5"/><text class="lang" x="42" y="132">Python</text>
    <text class="meta" x="120" y="132">217 commits · 12 releases</text>
  </g>
  <g transform="translate(445 0)">
    <rect class="card" x="0.5" y="0.5" width="434" height="154" rx="10"/>
    <rect x="1" y="1" width="433" height="3" rx="1.5" fill="url(#edge)"/>
    <text class="name" x="24" y="44">Timetable-bot</text>
    <text class="desc" x="24" y="72">Class schedule and notifications</text>
    <text class="desc" x="24" y="94">for Voronezh State University.</text>
    <circle cx="28" cy="128" r="5" fill="#3572A5"/><text class="lang" x="42" y="132">Python</text>
    <text class="meta" x="120" y="132">132 commits</text>
  </g>
  <g transform="translate(0 175)">
    <rect class="card" x="0.5" y="0.5" width="434" height="154" rx="10"/>
    <rect x="1" y="1" width="433" height="3" rx="1.5" fill="url(#edge)"/>
    <text class="name" x="24" y="44">powerpeek</text>
    <text class="desc" x="24" y="72">Device battery in the Windows tray.</text>
    <text class="desc" x="24" y="94">One 4 MB exe, no installer, no telemetry.</text>
    <circle cx="28" cy="128" r="5" fill="#f34b7d"/><text class="lang" x="42" y="132">C++</text>
    <text class="meta" x="90" y="132">54 commits</text>
  </g>
  <g transform="translate(445 175)">
    <rect class="card" x="0.5" y="0.5" width="434" height="154" rx="10"/>
    <rect x="1" y="1" width="433" height="3" rx="1.5" fill="url(#edge)"/>
    <text class="name" x="24" y="44">DialogEngine</text>
    <text class="desc" x="24" y="72">Lightweight dialog engine for</text>
    <text class="desc" x="24" y="94">form-driven Telegram bots.</text>
    <circle cx="28" cy="128" r="5" fill="#3572A5"/><text class="lang" x="42" y="132">Python</text>
    <text class="meta" x="120" y="132">27 commits · 3 releases</text>
